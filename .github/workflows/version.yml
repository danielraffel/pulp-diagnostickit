name: version

# "No changes without versioning": Scripts/check_version_bump.sh fails when
# the app's source changes without raising VERSION, and its controls prove the
# check can fail.
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check controls
        run: Scripts/test_check_version_bump.sh
      - name: Check VERSION
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ "$REF_NAME" = main ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base=origin/main
          fi
          Scripts/check_version_bump.sh --base "$base"
